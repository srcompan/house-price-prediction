<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            margin-top: 50px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background-color: #fff;
            box-sizing: border-box;
        }

        .form-group input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s ease;
        }

        .form-group input[type="submit"]:hover {
            background-color: #45a049;
        }

        .form-group input[type="submit"]:focus {
            outline: none;
        }

        .form-group input:focus {
            border-color: #4CAF50;
        }

        .predicted-price {
            text-align: center;
            font-size: 20px;
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 24px;
            }

            .form-group input {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            h1 {
                font-size: 20px;
            }

            .form-group input {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>House Price Prediction</h1>
        <form method="POST" action="/predict">
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" required>
            </div>
            <div class="form-group">
                <label for="society">Society</label>
                <input type="text" id="society" name="society" required>
            </div>
            <div class="form-group">
                <label for="bhk">BHK</label>
                <input type="number" id="bhk" name="bhk" required>
            </div>
            <div class="form-group">
                <label for="bath">Bathrooms</label>
                <input type="number" id="bath" name="bath" required>
            </div>
            <div class="form-group">
                <label for="balcony">Balconies</label>
                <input type="number" id="balcony" name="balcony" required>
            </div>
            <div class="form-group">
                <label for="total_sqft">Total Square Feet</label>
                <input type="number" id="total_sqft" name="total_sqft" required>
            </div>
            <div class="form-group">
                <input type="submit" value="Predict">
            </div>
        </form>

        {% if predicted_price %}
            <div class="predicted-price">
                <p>Predicted House Price: ₹{{ predicted_price }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
